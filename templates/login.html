{% extends "base.html" %}

{% block title %}ورود - سامانه ارزیابی RAG{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card login-card">
            <div class="card-header text-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-3" style="color: var(--accent-blue);">
                    <path d="M3 3v18h18"/>
                    <path d="m19 9-5 5-4-4-3 3"/>
                </svg>
                <h4 class="mb-0">سامانه ارزیابی RAG</h4>
                <p class="text-muted mt-2 mb-0">لطفا رمز عبور خود را وارد کنید</p>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">
                    <strong>خطا:</strong> {{ error }}
                </div>
                {% endif %}
                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-4">
                        <label class="form-label" for="password">رمز عبور</label>
                        <input type="password"
                               name="password"
                               id="password"
                               class="form-control form-control-lg"
                               placeholder="رمز عبور را وارد کنید"
                               required
                               autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        ورود به سامانه
                    </button>
                </form>
            </div>
            <div class="card-footer text-center text-muted">
                <small>دسترسی مدیر یا کارشناس</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
